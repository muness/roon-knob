## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.0'
  espressif/mdns:
    version: '>=1.2.0'
  lvgl/lvgl:
    version: ^9.4.0
  # ILI9342C (Tough's actual panel controller) is register-compatible with
