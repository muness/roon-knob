  # registry name/version via components.espressif.com on 2026-07-31.
  # TODO(hardware-verify): confirm ILI9342C-specific quirks (e.g. gamma/MADCTL
  # defaults) don't need vendor-init overrides once real hardware is available.
  espressif/esp_lcd_ili9341:
    version: ^2.0.2
