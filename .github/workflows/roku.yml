name: Roku clients
on:
  pull_request:
    paths:
      - 'roku/**'
      - '.github/workflows/roku.yml'
  push:
    branches: [master]
    paths:
      - 'roku/**'
      - '.github/workflows/roku.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roku-${{ github.ref }}
  cancel-in-progress: true
jobs:
  roku:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roku
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: roku/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: hiphi-roku-${{ github.sha }}
          path: roku/dist/
          if-no-files-found: error
