  build-idf:
    name: build-idf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get version from tag or CMakeLists
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep 'set(PROJECT_VER' idf_app/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building firmware version: $VERSION"

      - name: Inject version into CMakeLists.txt
        run: |
          sed -i 's/set(PROJECT_VER ".*")/set(PROJECT_VER "${{ steps.version.outputs.version }}")/' idf_app/CMakeLists.txt
          grep PROJECT_VER idf_app/CMakeLists.txt

      # Do not cache build/: it contains generated sdkconfig, CMake state, and
      # firmware that must be regenerated for the checked-out SHA. The IDF image
      # enables ccache; restoring it by prefix lets source
      # changes reuse prior object compilation while a distinct SHA key saves the
      # updated cache after each successful build.
      - name: Restore ESP-IDF compiler cache
        uses: actions/cache@v5
        with:
          path: .ci/ccache
          key: ${{ runner.os }}-esp-idf-v5.5.5-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-v5.5.5-ccache-

      - name: Restore Dial managed components
        uses: actions/cache@v5
        with:
          path: idf_app/managed_components
          key: ${{ runner.os }}-esp-idf-v5.5.5-dial-components-${{ hashFiles('idf_app/dependencies.lock') }}

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: idf_app
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ci/ccache
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_COMPRESS=1
          command: >-
            set -e;
            ccache --zero-stats;
            idf.py build;
            grep -Fx "CONFIG_COMPILER_OPTIMIZATION_PERF=y" sdkconfig;
            grep -Fx "CONFIG_PM_DFS_INIT_AUTO=y" sdkconfig;
            ! grep -Fx "CONFIG_COMPILER_OPTIMIZATION_DEBUG=y" sdkconfig;
            grep -Fx "CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192" sdkconfig;
            grep -Fx "CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE=4096" sdkconfig;
            grep -Fx "CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM=y" sdkconfig;
            grep -Fx "CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=49152" sdkconfig;
            grep -Fx "CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y" sdkconfig;
            grep -Fx "CONFIG_LV_MEM_SIZE_KILOBYTES=24" sdkconfig;
            grep -Fx "CONFIG_LV_MEM_POOL_EXPAND_SIZE_KILOBYTES=72" sdkconfig;
            grep -Fx "CONFIG_RK_BLE_HID_HOST=y" sdkconfig;
            grep -Fx "CONFIG_BT_ENABLED=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_ENABLED=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_NVS_PERSIST=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_SM_SC=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_HID_SERVICE=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_GATT_MAX_PROCS=2" sdkconfig;
            grep -F "/components/esp_hid/" build/compile_commands.json;
            grep -F "/generated/nimble_hidh.c" build/compile_commands.json;
            grep -F "/rk_ble_hid_host.c.obj" build/compile_commands.json;
            ! grep -F "rk_ble_hid_host_stub.c.obj" build/compile_commands.json;
            grep -E "^rk_ble_hid_host_init[[:space:]]+esp-idf/rk_ble_hid_host/librk_ble_hid_host[.]a[(]rk_ble_hid_host[.]c[.]obj[)][[:space:]]*$" build/hiphi_dial.map;
            ! grep -F "rk_ble_hid_host_stub" build/hiphi_dial.map;
            cp build/hiphi_dial.bin build/roon_knob.bin;
            cmp build/hiphi_dial.bin build/roon_knob.bin;
            esptool.py --chip esp32s3 merge_bin
            -o ../hiphi_dial_merged.bin
            --flash_mode dio --flash_freq 80m --flash_size 16MB
            0x0 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0xd000 build/ota_data_initial.bin
            0x10000 build/hiphi_dial.bin;
            ccache --show-stats

      - name: Verify merged Dial flash image
        run: |
          # Compatibility aliases remain byte-identical while bridge/release
          # consumers migrate to the HiPhi Dial artifact names.
          cp hiphi_dial_merged.bin roon_knob_merged.bin
          cmp idf_app/build/hiphi_dial.bin idf_app/build/roon_knob.bin
          cmp hiphi_dial_merged.bin roon_knob_merged.bin
          ls -la idf_app/build/hiphi_dial.bin idf_app/build/roon_knob.bin \
            hiphi_dial_merged.bin roon_knob_merged.bin

      - name: Upload ESP32-S3 artifact
        uses: actions/upload-artifact@v6
        with:
          name: esp32s3-firmware
          path: |
            idf_app/build/hiphi_dial.bin
            idf_app/build/roon_knob.bin
            idf_app/build/bootloader/bootloader.bin
            idf_app/build/partition_table/partition-table.bin
            idf_app/build/ota_data_initial.bin
            hiphi_dial_merged.bin
            roon_knob_merged.bin
          retention-days: 30

  build-frame:
    name: build-frame
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get firmware version
        id: frame-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep 'set(PROJECT_VER' idf_app/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building HiPhi Frame firmware version: $VERSION"

      - name: Inject version into Frame CMakeLists.txt
        run: |
          sed -i 's/set(PROJECT_VER ".*")/set(PROJECT_VER "${{ steps.frame-version.outputs.version }}")/' frame_app/CMakeLists.txt
          grep PROJECT_VER frame_app/CMakeLists.txt

      - name: Restore Frame compiler cache
        uses: actions/cache@v5
        with:
          path: .ci/ccache-frame
          key: ${{ runner.os }}-esp-idf-v5.5.5-frame-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-v5.5.5-frame-ccache-

      - name: Restore Frame managed components
        uses: actions/cache@v5
        with:
          path: frame_app/managed_components
          key: ${{ runner.os }}-esp-idf-v5.5.5-frame-components-${{ hashFiles('frame_app/dependencies.lock') }}

      - name: Build HiPhi Frame with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: frame_app
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ci/ccache-frame
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_COMPRESS=1
          command: >-
            set -e;
            ccache --zero-stats;
            idf.py build;
            grep -Fx "CONFIG_COMPILER_OPTIMIZATION_PERF=y" sdkconfig;
            grep -Fx "CONFIG_PM_DFS_INIT_AUTO=y" sdkconfig;
            ! grep -Fx "CONFIG_COMPILER_OPTIMIZATION_DEBUG=y" sdkconfig;
            grep -Fx "CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192" sdkconfig;
            grep -Fx "CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE=4096" sdkconfig;
            grep -Fx "CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM=y" sdkconfig;
            grep -Fx "CONFIG_RK_BLE_HID_HOST=y" sdkconfig;
            grep -Fx "CONFIG_BT_ENABLED=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_ENABLED=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_NVS_PERSIST=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_SM_SC=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_HID_SERVICE=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_GATT_MAX_PROCS=2" sdkconfig;
            grep -F "/components/esp_hid/" build/compile_commands.json;
            grep -F "/generated/nimble_hidh.c" build/compile_commands.json;
            grep -F "/rk_ble_hid_host.c.obj" build/compile_commands.json;
            ! grep -F "rk_ble_hid_host_stub.c.obj" build/compile_commands.json;
            grep -E "^rk_ble_hid_host_init[[:space:]]+esp-idf/rk_ble_hid_host/librk_ble_hid_host[.]a[(]rk_ble_hid_host[.]c[.]obj[)][[:space:]]*$" build/hiphi_frame.map;
            ! grep -F "rk_ble_hid_host_stub" build/hiphi_frame.map;
            grep -Fx "CONFIG_RK_FRAME_DEEP_SLEEP=y" sdkconfig;
            grep -F "esp_sleep_enable_ext1_wakeup_io" main/frame_power_manager.c;
            ! grep -F "esp_sleep_enable_timer_wakeup" main/frame_power_manager.c;
            grep -F "pmic_power_source()" main/frame_power_manager.c;
            grep -Fx "CONFIG_ESPTOOLPY_FLASHMODE_QIO=y" sdkconfig;
            grep -Fx "CONFIG_ESPTOOLPY_FLASHFREQ_80M=y" sdkconfig;
            esptool.py --chip esp32s3 merge_bin
            -o ../hiphi_frame_merged.bin
            --flash_mode dio --flash_freq 80m --flash_size 16MB
            0x0 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0xd000 build/ota_data_initial.bin
            0x10000 build/hiphi_frame.bin;
            esptool.py --chip esp32s3 image_info ../hiphi_frame_merged.bin;
            ccache --show-stats

      - name: Verify merged HiPhi Frame image
        run: |
          # ESP-IDF boots QIO configurations from a DIO image header, then the
          # second-stage bootloader enables quad mode.
          test "$(od -An -tu1 -j2 -N1 hiphi_frame_merged.bin | tr -d ' ')" = "2"
          ls -la frame_app/build/hiphi_frame.bin hiphi_frame_merged.bin

      - name: Upload HiPhi Frame artifact
        uses: actions/upload-artifact@v6
        with:
          name: hiphi-frame-firmware
          path: |
            frame_app/build/hiphi_frame.bin
            frame_app/build/bootloader/bootloader.bin
            frame_app/build/partition_table/partition-table.bin
            frame_app/build/ota_data_initial.bin
            hiphi_frame_merged.bin
          retention-days: 30

  build-rlcd:
    name: build-rlcd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get firmware version
        id: rlcd-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep 'set(PROJECT_VER' rlcd_app/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Inject version into RLCD CMakeLists.txt
        run: |
          sed -i 's/set(PROJECT_VER ".*")/set(PROJECT_VER "${{ steps.rlcd-version.outputs.version }}")/' rlcd_app/CMakeLists.txt
          grep PROJECT_VER rlcd_app/CMakeLists.txt

      - name: Restore RLCD compiler cache
        uses: actions/cache@v5
        with:
          path: .ci/ccache-rlcd
          key: ${{ runner.os }}-esp-idf-v5.5.5-rlcd-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-v5.5.5-rlcd-ccache-

      - name: Restore RLCD managed components
        uses: actions/cache@v5
        with:
          path: rlcd_app/managed_components
          key: ${{ runner.os }}-esp-idf-v5.5.5-rlcd-components-${{ hashFiles('rlcd_app/dependencies.lock') }}

      - name: Build HiPhi RLCD with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: rlcd_app
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ci/ccache-rlcd
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_COMPRESS=1
          command: >-
            set -e;
            ccache --zero-stats;
            idf.py build;
            grep -Fx "CONFIG_COMPILER_OPTIMIZATION_PERF=y" sdkconfig;
            grep -Fx "CONFIG_PM_DFS_INIT_AUTO=y" sdkconfig;
            grep -Fx "CONFIG_SPIRAM=y" sdkconfig;
            grep -Fx "CONFIG_RK_BLE_HID_HOST=y" sdkconfig;
            grep -Fx "CONFIG_BT_ENABLED=y" sdkconfig;
            grep -Fx "CONFIG_ESPTOOLPY_FLASHMODE_QIO=y" sdkconfig;
            cp build/hiphi_rlcd_42.bin ../hiphi_rlcd.bin;
            esptool.py --chip esp32s3 merge_bin
            -o ../hiphi_rlcd_merged.bin
            --flash_mode dio --flash_freq 80m --flash_size 16MB
            0x0 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0xd000 build/ota_data_initial.bin
            0x10000 build/hiphi_rlcd_42.bin;
            esptool.py --chip esp32s3 image_info ../hiphi_rlcd_merged.bin;
            ccache --show-stats

      - name: Verify merged HiPhi RLCD image
        run: |
          test "$(od -An -tu1 -j2 -N1 hiphi_rlcd_merged.bin | tr -d ' ')" = "2"
          ls -la rlcd_app/build/hiphi_rlcd_42.bin hiphi_rlcd.bin hiphi_rlcd_merged.bin

      - name: Upload HiPhi RLCD artifact
        uses: actions/upload-artifact@v6
        with:
          name: hiphi-rlcd-firmware
          path: |
            rlcd_app/build/hiphi_rlcd_42.bin
            rlcd_app/build/bootloader/bootloader.bin
            rlcd_app/build/partition_table/partition-table.bin
            rlcd_app/build/ota_data_initial.bin
            hiphi_rlcd.bin
            hiphi_rlcd_merged.bin
          retention-days: 30

  build-atom:
    name: build-atom-s3-joystick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Get firmware version
        id: atom-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF#refs/tags/v}; else VERSION=$(grep 'set(PROJECT_VER' atom_app/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/'); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Inject version into Atom CMakeLists.txt
        run: sed -i 's/set(PROJECT_VER ".*")/set(PROJECT_VER "${{ steps.atom-version.outputs.version }}")/' atom_app/CMakeLists.txt
      - name: Restore Atom managed components
        uses: actions/cache@v5
        with:
          path: atom_app/managed_components
          key: ${{ runner.os }}-esp-idf-v5.5.5-atom-components-${{ hashFiles('atom_app/dependencies.lock') }}
      - name: Build AtomS3 Joystick with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: atom_app
          command: >-
            set -e;
            idf.py build;
            grep -Fx "CONFIG_COMPILER_OPTIMIZATION_PERF=y" sdkconfig;
            grep -Fx "CONFIG_PM_DFS_INIT_AUTO=y" sdkconfig;
            grep -Fx "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" sdkconfig;
            grep -Fx "CONFIG_M5_PLATFORM_EXPECT_ATOMS3_JOYSTICK=y" sdkconfig;
            grep -Fx "CONFIG_FREERTOS_HZ=1000" sdkconfig;
            grep -Fx "CONFIG_ARDUINO_SELECTIVE_COMPILATION=y" sdkconfig;
            grep -F "/components/m5_platform/" build/compile_commands.json;
            grep -F "m5stack__m5unified" build/compile_commands.json;
            grep -F "/components/m5_official/vendor/Atom-JoyStick/" build/compile_commands.json;
            python3 ../scripts/check_m5_arduino_abi.py build/compile_commands.json;
            esptool.py --chip esp32s3 merge_bin -o ../hiphi_joy_merged.bin --flash_mode dio --flash_freq 80m --flash_size 8MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0xd000 build/ota_data_initial.bin 0x10000 build/hiphi_joy.bin;
            esptool.py --chip esp32s3 image_info ../hiphi_joy_merged.bin
      - name: Upload AtomS3 Joystick artifact
        uses: actions/upload-artifact@v6
        with:
          name: hiphi-joy-firmware
          path: |
            atom_app/build/hiphi_joy.bin
            atom_app/build/bootloader/bootloader.bin
            atom_app/build/partition_table/partition-table.bin
            atom_app/build/ota_data_initial.bin
            hiphi_joy_merged.bin
          retention-days: 30

  build-tough:
    name: build-m5-tough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Get firmware version
        id: tough-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF#refs/tags/v}; else VERSION=$(grep 'set(PROJECT_VER' tough_app/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/'); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Inject version into Tough CMakeLists.txt
        run: sed -i 's/set(PROJECT_VER ".*")/set(PROJECT_VER "${{ steps.tough-version.outputs.version }}")/' tough_app/CMakeLists.txt
      - name: Restore Tough managed components
        uses: actions/cache@v5
        with:
          path: tough_app/managed_components
          key: ${{ runner.os }}-esp-idf-v5.5.5-tough-components-${{ hashFiles('tough_app/dependencies.lock') }}
      - name: Build M5Stack Tough with pure ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          path: tough_app
          command: >-
            set -e;
            idf.py build;
            grep -Fx "CONFIG_COMPILER_OPTIMIZATION_PERF=y" sdkconfig;
            grep -Fx "CONFIG_PM_DFS_INIT_AUTO=y" sdkconfig;
            grep -Fx "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" sdkconfig;
            grep -Fx "CONFIG_M5_PLATFORM_EXPECT_TOUGH=y" sdkconfig;
            grep -Fx "CONFIG_SPIRAM_MODE_QUAD=y" sdkconfig;
            grep -F "/components/m5_platform/" build/compile_commands.json;
            grep -F "m5stack__m5unified" build/compile_commands.json;
            ! grep -F "espressif__arduino-esp32" build/compile_commands.json;
            ! grep -F "/official_components/m5_official/" build/compile_commands.json;
            esptool.py --chip esp32 merge_bin -o ../hiphi_tough_merged.bin --flash_mode dio --flash_freq 40m --flash_size 16MB 0x1000 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0xd000 build/ota_data_initial.bin 0x10000 build/hiphi_tough.bin;
            od -An -tu1 -j4096 -N1 ../hiphi_tough_merged.bin | grep -Eq "^[[:space:]]*233[[:space:]]*$";
            esptool.py --chip esp32 image_info build/bootloader/bootloader.bin;
            esptool.py --chip esp32 image_info build/hiphi_tough.bin
      - name: Upload M5Stack Tough artifact
        uses: actions/upload-artifact@v6
        with:
          name: hiphi-tough-firmware
          path: |
            tough_app/build/hiphi_tough.bin
            tough_app/build/bootloader/bootloader.bin
            tough_app/build/partition_table/partition-table.bin
            tough_app/build/ota_data_initial.bin
            hiphi_tough_merged.bin
          retention-days: 30

  build-m5-betas:
    name: build-m5-beta-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dial
            flash_size: 8MB
            psram: false
            expected: DIAL
          - target: sticks3
            flash_size: 8MB
            psram: true
            expected: STICKS3
          - target: stopwatch
            flash_size: 16MB
            psram: true
            expected: STOPWATCH
          - target: stackchan
            flash_size: 16MB
            psram: true
            expected: STACKCHAN
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Get firmware version
        id: m5-beta-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF#refs/tags/v}; else VERSION=$(grep 'set(PROJECT_VER' m5_beta_app/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/'); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Inject version into M5 beta CMakeLists.txt
        run: sed -i 's/set(PROJECT_VER ".*")/set(PROJECT_VER "${{ steps.m5-beta-version.outputs.version }}")/' m5_beta_app/CMakeLists.txt
      - name: Restore M5 beta managed components
        uses: actions/cache@v5
        with:
          path: m5_beta_app/managed_components
          key: ${{ runner.os }}-esp-idf-v5.5.5-m5-beta-components-${{ hashFiles('m5_beta_app/dependencies.lock') }}
      - name: Build exact M5 beta profile
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: m5_beta_app
          command: >-
            set -e;
            idf.py -B build-${{ matrix.target }}
            -D HIPHI_M5_TARGET=${{ matrix.target }}
            -D SDKCONFIG=build-${{ matrix.target }}/sdkconfig build;
            grep -Fx "CONFIG_COMPILER_OPTIMIZATION_PERF=y" build-${{ matrix.target }}/sdkconfig;
            grep -Fx "CONFIG_PM_DFS_INIT_AUTO=y" build-${{ matrix.target }}/sdkconfig;
            grep -Fx "CONFIG_ESPTOOLPY_FLASHSIZE_${{ matrix.flash_size }}=y" build-${{ matrix.target }}/sdkconfig;
            if [ "${{ matrix.psram }}" = "true" ]; then grep -Fx "CONFIG_SPIRAM=y" build-${{ matrix.target }}/sdkconfig; else ! grep -Fx "CONFIG_SPIRAM=y" build-${{ matrix.target }}/sdkconfig; fi;
            grep -Fx "CONFIG_M5_PLATFORM_EXPECT_${{ matrix.expected }}=y" build-${{ matrix.target }}/sdkconfig;
            grep -Fx "CONFIG_ESPTOOLPY_FLASHMODE_QIO=y" build-${{ matrix.target }}/sdkconfig;
            grep -Fx "CONFIG_ESPTOOLPY_FLASHFREQ_80M=y" build-${{ matrix.target }}/sdkconfig;
            case "${{ matrix.target }}" in
              dial) ! grep -Fx "CONFIG_SPIRAM_MODE_QUAD=y" build-${{ matrix.target }}/sdkconfig; ! grep -Fx "CONFIG_SPIRAM_MODE_OCT=y" build-${{ matrix.target }}/sdkconfig; grep -Fx "CONFIG_FREERTOS_HZ=1000" build-${{ matrix.target }}/sdkconfig; grep -Fx "CONFIG_ARDUINO_SELECTIVE_COMPILATION=y" build-${{ matrix.target }}/sdkconfig; grep -F "/components/m5_official/vendor/M5Dial/" build-${{ matrix.target }}/compile_commands.json; python3 ../scripts/check_m5_arduino_abi.py build-${{ matrix.target }}/compile_commands.json ;;
              sticks3|stopwatch) grep -Fx "CONFIG_SPIRAM_MODE_OCT=y" build-${{ matrix.target }}/sdkconfig; ! grep -Fx "CONFIG_SPIRAM_MODE_QUAD=y" build-${{ matrix.target }}/sdkconfig; grep -Fx "CONFIG_SPIRAM_BOOT_INIT=y" build-${{ matrix.target }}/sdkconfig; ! grep -F "espressif__arduino-esp32" build-${{ matrix.target }}/compile_commands.json; ! grep -F "/components/m5_official/" build-${{ matrix.target }}/compile_commands.json ;;
              stackchan) grep -Fx "CONFIG_SPIRAM_MODE_QUAD=y" build-${{ matrix.target }}/sdkconfig; ! grep -Fx "CONFIG_SPIRAM_MODE_OCT=y" build-${{ matrix.target }}/sdkconfig; grep -Fx "CONFIG_SPIRAM_BOOT_INIT=y" build-${{ matrix.target }}/sdkconfig; grep -Fx "CONFIG_FREERTOS_HZ=1000" build-${{ matrix.target }}/sdkconfig; grep -Fx "CONFIG_ARDUINO_SELECTIVE_COMPILATION=y" build-${{ matrix.target }}/sdkconfig; grep -F "/components/m5_official/vendor/StackChan-BSP/" build-${{ matrix.target }}/compile_commands.json; python3 ../scripts/check_m5_arduino_abi.py build-${{ matrix.target }}/compile_commands.json ;;
            esac;
            esptool.py --chip esp32s3 merge_bin
            -o ../hiphi_${{ matrix.target }}_merged.bin
            --flash_mode dio --flash_freq 80m --flash_size ${{ matrix.flash_size }}
            0x0 build-${{ matrix.target }}/bootloader/bootloader.bin
            0x8000 build-${{ matrix.target }}/partition_table/partition-table.bin
            0xd000 build-${{ matrix.target }}/ota_data_initial.bin
            0x10000 build-${{ matrix.target }}/hiphi_${{ matrix.target }}.bin;
            esptool.py --chip esp32s3 image_info ../hiphi_${{ matrix.target }}_merged.bin
      - name: Upload M5 beta artifact
        uses: actions/upload-artifact@v6
        with:
          name: hiphi-m5-beta-${{ matrix.target }}
          path: |
            m5_beta_app/build-${{ matrix.target }}/hiphi_${{ matrix.target }}.bin
            m5_beta_app/build-${{ matrix.target }}/bootloader/bootloader.bin
            m5_beta_app/build-${{ matrix.target }}/partition_table/partition-table.bin
            m5_beta_app/build-${{ matrix.target }}/ota_data_initial.bin
            hiphi_${{ matrix.target }}_merged.bin
          retention-days: 30

  build-knob-aux:
    name: build-waveshare-knob-aux-parking-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get firmware version
        id: knob-aux-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF#refs/tags/v}; else VERSION=$(grep 'set(PROJECT_VER' knob_aux_app/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/'); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Inject version into auxiliary CMakeLists.txt
        run: sed -i 's/set(PROJECT_VER ".*")/set(PROJECT_VER "${{ steps.knob-aux-version.outputs.version }}")/' knob_aux_app/CMakeLists.txt

      - name: Build auxiliary ESP32 parking firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          path: knob_aux_app
          command: >-
            set -e;
            idf.py build;
            grep -Fx "CONFIG_COMPILER_OPTIMIZATION_PERF=y" sdkconfig;
            grep -Fx "CONFIG_IDF_TARGET_ESP32=y" sdkconfig;
            grep -Fx "CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y" sdkconfig;
            grep -Fx "CONFIG_BOOTLOADER_LOG_LEVEL_NONE=y" sdkconfig;
            grep -Fx "CONFIG_LOG_DEFAULT_LEVEL_NONE=y" sdkconfig;
            grep -F "esp_sleep_disable_wakeup_source(ESP_SLEEP_WAKEUP_ALL)" main/main.c;
            grep -F "ESP_PD_DOMAIN_RTC_PERIPH, ESP_PD_OPTION_OFF" main/main.c;
            grep -F "ESP_PD_DOMAIN_RTC_SLOW_MEM, ESP_PD_OPTION_OFF" main/main.c;
            grep -F "ESP_PD_DOMAIN_RTC_FAST_MEM, ESP_PD_OPTION_OFF" main/main.c;
            ! grep -E "vTaskDelay|esp_wifi|esp_bt|nimble" main/main.c;
            esptool.py --chip esp32 merge_bin
            -o ../hiphi_knob_aux_park_merged.bin
            --flash_mode dio --flash_freq 40m --flash_size 4MB
            0x1000 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0x10000 build/hiphi_knob_aux_park.bin;
            esptool.py --chip esp32 image_info build/hiphi_knob_aux_park.bin

      - name: Upload auxiliary parking firmware
        uses: actions/upload-artifact@v6
        with:
          name: hiphi-knob-aux-parking-firmware
          path: |
            knob_aux_app/build/hiphi_knob_aux_park.bin
            knob_aux_app/build/bootloader/bootloader.bin
            knob_aux_app/build/partition_table/partition-table.bin
            hiphi_knob_aux_park_merged.bin
          retention-days: 30

  build-ble-off:
    name: build-ble-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build ESP32-S3 capability-disabled fixture
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: tests/fixtures/rk_ble_hid_off
          command: >-
            set -e;
            idf.py build;
            ! grep -Fx "CONFIG_RK_BLE_HID_HOST=y" sdkconfig;
            ! grep -Fx "CONFIG_BT_ENABLED=y" sdkconfig;
            grep -F "rk_ble_hid_host_stub.c.obj" build/compile_commands.json;
            ! grep -F "/rk_ble_hid_host.c.obj" build/compile_commands.json;
            grep -E "^rk_ble_hid_host_init[[:space:]]+esp-idf/rk_ble_hid_host_stub/librk_ble_hid_host_stub[.]a[(]rk_ble_hid_host_stub[.]c[.]obj[)][[:space:]]*$" build/rk_ble_hid_off.map;
            ! grep -F "rk_ble_hid_host.c.obj" build/rk_ble_hid_off.map;
            ! grep -E "nimble_hidh.c.obj|esp_hidh.c.obj" build/compile_commands.json

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test-shared, build-idf, build-frame, build-rlcd, build-atom, build-tough, build-m5-betas, build-knob-aux, build-ble-off]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download ESP32-S3 firmware
        uses: actions/download-artifact@v7
        with:
          name: esp32s3-firmware
          path: esp32s3-artifacts

      - name: Download HiPhi Frame firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-frame-firmware
          path: frame-artifacts

      - name: Download HiPhi RLCD firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-rlcd-firmware
          path: rlcd-artifacts

      - name: Download AtomS3 JoyStick firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-joy-firmware
          path: joy-artifacts

      - name: Download M5Stack Tough firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-tough-firmware
          path: tough-artifacts

      - name: Download form-native M5 beta firmware
        uses: actions/download-artifact@v7
        with:
          pattern: hiphi-m5-beta-*
          path: m5-beta-artifacts
          merge-multiple: true

      - name: Download Waveshare auxiliary parking firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-knob-aux-parking-firmware
          path: aux-artifacts

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Get release notes from draft
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Try to get draft release body (maintained by release-drafter)
          DRAFT_BODY=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.draft == true) | .body' 2>/dev/null | head -1 || echo "")

          # Check if draft has actual PR content (not just empty template)
          if [ -n "$DRAFT_BODY" ] && echo "$DRAFT_BODY" | grep -q "github.com.*pull"; then
            echo "$DRAFT_BODY" > release_notes.md
            echo "Using draft release notes from release-drafter"
          else
            # Fallback: generate notes via GitHub API
            echo "Draft empty or no PRs, generating from GitHub API..."
            # Get previous tag via GitHub API (more reliable than git in shallow clones)
            PREV_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[].name' | grep '^v' | sort -V | grep -B1 "^${{ github.ref_name }}$" | head -1)
            if [ "$PREV_TAG" = "${{ github.ref_name }}" ]; then
              # Current tag is oldest, no previous
              PREV_TAG=""
            fi
            echo "Previous tag: $PREV_TAG"
            if [ -n "$PREV_TAG" ]; then
              gh api repos/${{ github.repository }}/releases/generate-notes \
                -f tag_name="${{ github.ref_name }}" \
                -f previous_tag_name="$PREV_TAG" \
                --jq '.body' > release_notes.md 2>/dev/null || echo "## What's Changed" > release_notes.md
            else
              echo "## What's Changed" > release_notes.md
            fi
            echo "Generated release notes"
          fi
          echo "--- Release notes content ---"
          cat release_notes.md

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp esp32s3-artifacts/idf_app/build/hiphi_dial.bin release-assets/
          cp esp32s3-artifacts/idf_app/build/roon_knob.bin release-assets/
          cp esp32s3-artifacts/idf_app/build/bootloader/bootloader.bin \
            release-assets/hiphi_dial_bootloader.bin
          cp esp32s3-artifacts/idf_app/build/partition_table/partition-table.bin \
            release-assets/hiphi_dial_partition-table.bin
          cp esp32s3-artifacts/idf_app/build/ota_data_initial.bin \
            release-assets/hiphi_dial_ota_data_initial.bin
          cp esp32s3-artifacts/hiphi_dial_merged.bin release-assets/
          cp esp32s3-artifacts/roon_knob_merged.bin release-assets/
          cmp release-assets/hiphi_dial.bin release-assets/roon_knob.bin
          cmp release-assets/hiphi_dial_merged.bin \
            release-assets/roon_knob_merged.bin
          cp frame-artifacts/frame_app/build/hiphi_frame.bin release-assets/
          cp frame-artifacts/frame_app/build/bootloader/bootloader.bin \
            release-assets/hiphi_frame_bootloader.bin
          cp frame-artifacts/frame_app/build/partition_table/partition-table.bin \
            release-assets/hiphi_frame_partition-table.bin
          cp frame-artifacts/frame_app/build/ota_data_initial.bin \
            release-assets/hiphi_frame_ota_data_initial.bin
          cp frame-artifacts/hiphi_frame_merged.bin release-assets/
          cp rlcd-artifacts/hiphi_rlcd.bin release-assets/
          cp rlcd-artifacts/rlcd_app/build/bootloader/bootloader.bin \
            release-assets/hiphi_rlcd_bootloader.bin
          cp rlcd-artifacts/rlcd_app/build/partition_table/partition-table.bin \
            release-assets/hiphi_rlcd_partition-table.bin
          cp rlcd-artifacts/rlcd_app/build/ota_data_initial.bin \
            release-assets/hiphi_rlcd_ota_data_initial.bin
          cp rlcd-artifacts/hiphi_rlcd_merged.bin release-assets/

          cp joy-artifacts/atom_app/build/hiphi_joy.bin release-assets/
          cp joy-artifacts/atom_app/build/bootloader/bootloader.bin \
            release-assets/hiphi_joy_bootloader.bin
          cp joy-artifacts/atom_app/build/partition_table/partition-table.bin \
            release-assets/hiphi_joy_partition-table.bin
          cp joy-artifacts/atom_app/build/ota_data_initial.bin \
            release-assets/hiphi_joy_ota_data_initial.bin
          cp joy-artifacts/hiphi_joy_merged.bin release-assets/

          cp tough-artifacts/tough_app/build/hiphi_tough.bin release-assets/
          cp tough-artifacts/tough_app/build/bootloader/bootloader.bin \
            release-assets/hiphi_tough_bootloader.bin
          cp tough-artifacts/tough_app/build/partition_table/partition-table.bin \
            release-assets/hiphi_tough_partition-table.bin
          cp tough-artifacts/tough_app/build/ota_data_initial.bin \
            release-assets/hiphi_tough_ota_data_initial.bin
          cp tough-artifacts/hiphi_tough_merged.bin release-assets/

          prepare_m5_release() {
            local build_target="$1"
            local release_target="$2"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/hiphi_${build_target}.bin" \
              "release-assets/hiphi_${release_target}.bin"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/bootloader/bootloader.bin" \
              "release-assets/hiphi_${release_target}_bootloader.bin"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/partition_table/partition-table.bin" \
              "release-assets/hiphi_${release_target}_partition-table.bin"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/ota_data_initial.bin" \
              "release-assets/hiphi_${release_target}_ota_data_initial.bin"
            cp "m5-beta-artifacts/hiphi_${build_target}_merged.bin" \
              "release-assets/hiphi_${release_target}_merged.bin"
          }
          prepare_m5_release dial m5dial
          prepare_m5_release sticks3 sticks3
          prepare_m5_release stopwatch stopwatch
          prepare_m5_release stackchan stackchan

          cp aux-artifacts/knob_aux_app/build/hiphi_knob_aux_park.bin \
            release-assets/
          cp aux-artifacts/knob_aux_app/build/bootloader/bootloader.bin \
            release-assets/hiphi_knob_aux_park_bootloader.bin
          cp aux-artifacts/knob_aux_app/build/partition_table/partition-table.bin \
            release-assets/hiphi_knob_aux_park_partition-table.bin
          cp aux-artifacts/hiphi_knob_aux_park_merged.bin release-assets/

          (cd release-assets && sha256sum *.bin > SHA256SUMS.txt)
          ls -la release-assets/

      - name: Build release body
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Lead with the useful, curated notes. Keep the generated PR list as
          # reference material at the end instead of making readers dig through
          # it before learning what the release does.
          sed "s/{{VERSION}}/$VERSION/g" .github/RELEASE_TEMPLATE.md > final_body.md
          printf '\n---\n\n## Complete changelog\n\n' >> final_body.md
          cat release_notes.md >> final_body.md

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_EXISTS=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets | length' 2>/dev/null || echo "0")
          echo "existing_assets=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_EXISTS" -gt "0" ]; then
            echo "Release already exists with $RELEASE_EXISTS assets, will only upload missing files"
          fi

      - name: Create or Update Release
        if: steps.check_release.outputs.existing_assets == '0'
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: release-assets/*
          body_path: final_body.md

      - name: Upload assets to existing release
        if: steps.check_release.outputs.existing_assets != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload any missing assets
          for file in release-assets/*; do
            filename=$(basename "$file")
            if ! gh release view ${{ github.ref_name }} --json assets --jq ".assets[].name" | grep -q "^${filename}$"; then
              echo "Uploading $filename..."
              gh release upload ${{ github.ref_name }} "$file" --clobber
            else
              echo "$filename already exists, skipping"
            fi
          done

      - name: Verify prereleases cannot become stable OTA
        if: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.prerelease')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" != "${GITHUB_REF_NAME}"

  # NOTE: Docker builds moved to unified-hifi-control repo
  # The muness/unified-hifi-control and muness/roon-extension-knob images
  # are now built from https://github.com/cloud-atlas-ai/unified-hifi-control

  deploy-pr-preview:
    name: Deploy All PR Firmware Previews
    runs-on: ubuntu-latest
    needs: [test-shared, build-idf, build-frame, build-rlcd, build-atom, build-tough, build-m5-betas, build-knob-aux, build-ble-off]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Dial firmware
        uses: actions/download-artifact@v7
        with:
          name: esp32s3-firmware
          path: esp32s3-artifacts

      - name: Download Frame firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-frame-firmware
          path: frame-artifacts

      - name: Download RLCD firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-rlcd-firmware
          path: rlcd-artifacts

      - name: Download AtomS3 JoyStick firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-joy-firmware
          path: joy-artifacts

      - name: Download M5Stack Tough firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-tough-firmware
          path: tough-artifacts

      - name: Download form-native M5 beta firmware
        uses: actions/download-artifact@v7
        with:
          pattern: hiphi-m5-beta-*
          path: m5-beta-artifacts
          merge-multiple: true

      - name: Download Waveshare Dial auxiliary parking firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-knob-aux-parking-firmware
          path: aux-artifacts

      - name: Read preview commit metadata
        id: preview-commit
        uses: actions/github-script@v8
        with:
          script: |
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });
            core.setOutput('subject', commit.commit.message.split(/\r?\n/, 1)[0]);

      - name: Prepare all PR preview content
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          PREVIEW_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_MERGE_SHA: ${{ github.sha }}
          PREVIEW_COMMIT_SUBJECT: ${{ steps.preview-commit.outputs.subject }}
          PREVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p pr-preview
          PREVIEW_CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PREVIEW_HEAD_SHA_SHORT="${PREVIEW_HEAD_SHA:0:12}"
          PREVIEW_MERGE_SHA_SHORT="${PREVIEW_MERGE_SHA:0:12}"
          PREVIEW_SUBJECT_B64="$(printf '%s' "${PREVIEW_COMMIT_SUBJECT}" | base64 --wrap=0)"

          DIAL_MANIFEST_FILE="manifest-s3-${PREVIEW_ID}.json"
          DIAL_APPLICATION_FILE="hiphi_dial-${PREVIEW_ID}.bin"
          DIAL_BOOTLOADER_FILE="hiphi_dial_bootloader-${PREVIEW_ID}.bin"
          DIAL_PARTITION_FILE="hiphi_dial_partition-table-${PREVIEW_ID}.bin"
          DIAL_OTA_DATA_FILE="hiphi_dial_ota_data_initial-${PREVIEW_ID}.bin"
          DIAL_LEGACY_APPLICATION_FILE="roon_knob-${PREVIEW_ID}.bin"
          DIAL_FIRMWARE_FILE="hiphi_dial_merged-${PREVIEW_ID}.bin"
          DIAL_LEGACY_FIRMWARE_FILE="roon_knob_merged-${PREVIEW_ID}.bin"
          DIAL_FLASH_PAGE="flash-dial-${PREVIEW_ID}.html"

          AUX_MANIFEST_FILE="manifest-knob-aux-${PREVIEW_ID}.json"
          AUX_APPLICATION_FILE="hiphi_knob_aux_park-${PREVIEW_ID}.bin"
          AUX_BOOTLOADER_FILE="hiphi_knob_aux_park_bootloader-${PREVIEW_ID}.bin"
          AUX_PARTITION_FILE="hiphi_knob_aux_park_partition-table-${PREVIEW_ID}.bin"
          AUX_FIRMWARE_FILE="hiphi_knob_aux_park_merged-${PREVIEW_ID}.bin"

          FRAME_MANIFEST_FILE="manifest-frame-${PREVIEW_ID}.json"
          FRAME_APPLICATION_FILE="hiphi_frame-${PREVIEW_ID}.bin"
          FRAME_BOOTLOADER_FILE="hiphi_frame_bootloader-${PREVIEW_ID}.bin"
          FRAME_PARTITION_FILE="hiphi_frame_partition-table-${PREVIEW_ID}.bin"
          FRAME_OTA_DATA_FILE="hiphi_frame_ota_data_initial-${PREVIEW_ID}.bin"
          FRAME_FIRMWARE_FILE="hiphi_frame_merged-${PREVIEW_ID}.bin"
          FRAME_FLASH_PAGE="flash-frame-${PREVIEW_ID}.html"

          RLCD_MANIFEST_FILE="manifest-rlcd-${PREVIEW_ID}.json"
          RLCD_APPLICATION_FILE="hiphi_rlcd-${PREVIEW_ID}.bin"
          RLCD_BOOTLOADER_FILE="hiphi_rlcd_bootloader-${PREVIEW_ID}.bin"
          RLCD_PARTITION_FILE="hiphi_rlcd_partition-table-${PREVIEW_ID}.bin"
          RLCD_OTA_DATA_FILE="hiphi_rlcd_ota_data_initial-${PREVIEW_ID}.bin"
          RLCD_FIRMWARE_FILE="hiphi_rlcd_merged-${PREVIEW_ID}.bin"
          RLCD_FLASH_PAGE="flash-rlcd-${PREVIEW_ID}.html"

          JOY_MANIFEST_FILE="manifest-joy-${PREVIEW_ID}.json"
          JOY_APPLICATION_FILE="hiphi_joy-${PREVIEW_ID}.bin"
          JOY_BOOTLOADER_FILE="hiphi_joy_bootloader-${PREVIEW_ID}.bin"
          JOY_PARTITION_FILE="hiphi_joy_partition-table-${PREVIEW_ID}.bin"
          JOY_OTA_DATA_FILE="hiphi_joy_ota_data_initial-${PREVIEW_ID}.bin"
          JOY_FIRMWARE_FILE="hiphi_joy_merged-${PREVIEW_ID}.bin"
          JOY_FLASH_PAGE="flash-joy-${PREVIEW_ID}.html"

          TOUGH_MANIFEST_FILE="manifest-tough-${PREVIEW_ID}.json"
          TOUGH_APPLICATION_FILE="hiphi_tough-${PREVIEW_ID}.bin"
          TOUGH_BOOTLOADER_FILE="hiphi_tough_bootloader-${PREVIEW_ID}.bin"
          TOUGH_PARTITION_FILE="hiphi_tough_partition-table-${PREVIEW_ID}.bin"
          TOUGH_OTA_DATA_FILE="hiphi_tough_ota_data_initial-${PREVIEW_ID}.bin"
          TOUGH_FIRMWARE_FILE="hiphi_tough_merged-${PREVIEW_ID}.bin"
          TOUGH_FLASH_PAGE="flash-tough-${PREVIEW_ID}.html"

          # Use immutable names so an older preview can never flash a newer build.
          cp esp32s3-artifacts/idf_app/build/hiphi_dial.bin "pr-preview/${DIAL_APPLICATION_FILE}"
          cp esp32s3-artifacts/idf_app/build/bootloader/bootloader.bin "pr-preview/${DIAL_BOOTLOADER_FILE}"
          cp esp32s3-artifacts/idf_app/build/partition_table/partition-table.bin "pr-preview/${DIAL_PARTITION_FILE}"
          cp esp32s3-artifacts/idf_app/build/ota_data_initial.bin "pr-preview/${DIAL_OTA_DATA_FILE}"
          cp esp32s3-artifacts/idf_app/build/roon_knob.bin "pr-preview/${DIAL_LEGACY_APPLICATION_FILE}"
          cp esp32s3-artifacts/hiphi_dial_merged.bin "pr-preview/${DIAL_FIRMWARE_FILE}"
          cp esp32s3-artifacts/roon_knob_merged.bin "pr-preview/${DIAL_LEGACY_FIRMWARE_FILE}"
          cmp "pr-preview/${DIAL_APPLICATION_FILE}" "pr-preview/${DIAL_LEGACY_APPLICATION_FILE}"
          cmp "pr-preview/${DIAL_FIRMWARE_FILE}" "pr-preview/${DIAL_LEGACY_FIRMWARE_FILE}"

          cp aux-artifacts/knob_aux_app/build/hiphi_knob_aux_park.bin "pr-preview/${AUX_APPLICATION_FILE}"
          cp aux-artifacts/knob_aux_app/build/bootloader/bootloader.bin "pr-preview/${AUX_BOOTLOADER_FILE}"
          cp aux-artifacts/knob_aux_app/build/partition_table/partition-table.bin "pr-preview/${AUX_PARTITION_FILE}"
          cp aux-artifacts/hiphi_knob_aux_park_merged.bin "pr-preview/${AUX_FIRMWARE_FILE}"

          cp frame-artifacts/frame_app/build/hiphi_frame.bin "pr-preview/${FRAME_APPLICATION_FILE}"
          cp frame-artifacts/frame_app/build/bootloader/bootloader.bin "pr-preview/${FRAME_BOOTLOADER_FILE}"
          cp frame-artifacts/frame_app/build/partition_table/partition-table.bin "pr-preview/${FRAME_PARTITION_FILE}"
          cp frame-artifacts/frame_app/build/ota_data_initial.bin "pr-preview/${FRAME_OTA_DATA_FILE}"
          cp frame-artifacts/hiphi_frame_merged.bin "pr-preview/${FRAME_FIRMWARE_FILE}"

          cp rlcd-artifacts/hiphi_rlcd.bin "pr-preview/${RLCD_APPLICATION_FILE}"
          cp rlcd-artifacts/rlcd_app/build/bootloader/bootloader.bin "pr-preview/${RLCD_BOOTLOADER_FILE}"
          cp rlcd-artifacts/rlcd_app/build/partition_table/partition-table.bin "pr-preview/${RLCD_PARTITION_FILE}"
          cp rlcd-artifacts/rlcd_app/build/ota_data_initial.bin "pr-preview/${RLCD_OTA_DATA_FILE}"
          cp rlcd-artifacts/hiphi_rlcd_merged.bin "pr-preview/${RLCD_FIRMWARE_FILE}"

          cp joy-artifacts/atom_app/build/hiphi_joy.bin "pr-preview/${JOY_APPLICATION_FILE}"
          cp joy-artifacts/atom_app/build/bootloader/bootloader.bin "pr-preview/${JOY_BOOTLOADER_FILE}"
          cp joy-artifacts/atom_app/build/partition_table/partition-table.bin "pr-preview/${JOY_PARTITION_FILE}"
          cp joy-artifacts/atom_app/build/ota_data_initial.bin "pr-preview/${JOY_OTA_DATA_FILE}"
          cp joy-artifacts/hiphi_joy_merged.bin "pr-preview/${JOY_FIRMWARE_FILE}"

          cp tough-artifacts/tough_app/build/hiphi_tough.bin "pr-preview/${TOUGH_APPLICATION_FILE}"
          cp tough-artifacts/tough_app/build/bootloader/bootloader.bin "pr-preview/${TOUGH_BOOTLOADER_FILE}"
          cp tough-artifacts/tough_app/build/partition_table/partition-table.bin "pr-preview/${TOUGH_PARTITION_FILE}"
          cp tough-artifacts/tough_app/build/ota_data_initial.bin "pr-preview/${TOUGH_OTA_DATA_FILE}"
          cp tough-artifacts/hiphi_tough_merged.bin "pr-preview/${TOUGH_FIRMWARE_FILE}"

          prepare_m5_beta() {
            local build_target="$1"
            local page_target="$2"
            local display_name="$3"
            local manifest="manifest-${page_target}-${PREVIEW_ID}.json"
            local app="hiphi_${page_target}-${PREVIEW_ID}.bin"
            local boot="hiphi_${page_target}_bootloader-${PREVIEW_ID}.bin"
            local partition="hiphi_${page_target}_partition-table-${PREVIEW_ID}.bin"
            local ota="hiphi_${page_target}_ota_data_initial-${PREVIEW_ID}.bin"
            local merged="hiphi_${page_target}_merged-${PREVIEW_ID}.bin"

            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/hiphi_${build_target}.bin" "pr-preview/${app}"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/bootloader/bootloader.bin" "pr-preview/${boot}"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/partition_table/partition-table.bin" "pr-preview/${partition}"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/ota_data_initial.bin" "pr-preview/${ota}"
            cp "m5-beta-artifacts/hiphi_${build_target}_merged.bin" "pr-preview/${merged}"

            cat > "pr-preview/${manifest}" << EOF
          {
            "name": "${display_name} (PR #${PR_NUM} Hardware-Unverified Alpha)",
            "version": "pr-${PR_NUM}",
            "new_install_prompt_erase": true,
            "builds": [{"chipFamily": "ESP32-S3", "parts": [
              {"path": "${boot}", "offset": 0},
              {"path": "${partition}", "offset": 32768},
              {"path": "${ota}", "offset": 53248},
              {"path": "${app}", "offset": 65536}
            ]}]
          }
          EOF
          }

          prepare_m5_beta dial m5dial "M5 Dial Form-Native"
          prepare_m5_beta sticks3 sticks3 "M5StickS3 Twist Remote"
          prepare_m5_beta stopwatch stopwatch "M5Stack StopWatch Wrist Remote"
          prepare_m5_beta stackchan stackchan "Kizz Playback Companion"

          cat > "pr-preview/${DIAL_MANIFEST_FILE}" << EOF
          {
            "name": "HiPhi Dial Alpha (PR #${PR_NUM} Preview)",
            "version": "pr-${PR_NUM}",
            "new_install_prompt_erase": true,
            "builds": [{"chipFamily": "ESP32-S3", "parts": [
              {"path": "${DIAL_BOOTLOADER_FILE}", "offset": 0},
              {"path": "${DIAL_PARTITION_FILE}", "offset": 32768},
              {"path": "${DIAL_OTA_DATA_FILE}", "offset": 53248},
              {"path": "${DIAL_APPLICATION_FILE}", "offset": 65536}
            ]}]
          }
          EOF
          cat > "pr-preview/${AUX_MANIFEST_FILE}" << EOF
          {
            "name": "Waveshare Dial Auxiliary ESP32 Parking Image (PR #${PR_NUM})",
            "version": "pr-${PR_NUM}",
            "new_install_prompt_erase": true,
            "builds": [{"chipFamily": "ESP32", "parts": [
              {"path": "${AUX_BOOTLOADER_FILE}", "offset": 4096},
              {"path": "${AUX_PARTITION_FILE}", "offset": 32768},
              {"path": "${AUX_APPLICATION_FILE}", "offset": 65536}
            ]}]
          }
          EOF
          cat > "pr-preview/${FRAME_MANIFEST_FILE}" << EOF
          {
            "name": "HiPhi Frame Alpha (PR #${PR_NUM} Preview)",
            "version": "pr-${PR_NUM}",
            "new_install_prompt_erase": true,
            "builds": [{"chipFamily": "ESP32-S3", "parts": [
              {"path": "${FRAME_BOOTLOADER_FILE}", "offset": 0},
              {"path": "${FRAME_PARTITION_FILE}", "offset": 32768},
              {"path": "${FRAME_OTA_DATA_FILE}", "offset": 53248},
              {"path": "${FRAME_APPLICATION_FILE}", "offset": 65536}
            ]}]
          }
          EOF
          cat > "pr-preview/${RLCD_MANIFEST_FILE}" << EOF
          {
            "name": "HiPhi RLCD Alpha (PR #${PR_NUM} Preview)",
            "version": "pr-${PR_NUM}",
            "new_install_prompt_erase": true,
            "builds": [{"chipFamily": "ESP32-S3", "parts": [
              {"path": "${RLCD_BOOTLOADER_FILE}", "offset": 0},
              {"path": "${RLCD_PARTITION_FILE}", "offset": 32768},
              {"path": "${RLCD_OTA_DATA_FILE}", "offset": 53248},
              {"path": "${RLCD_APPLICATION_FILE}", "offset": 65536}
            ]}]
          }
          EOF

          cat > "pr-preview/${JOY_MANIFEST_FILE}" << EOF
          {
            "name": "AtomS3 JoyStick Alpha (PR #${PR_NUM} Preview)",
            "version": "pr-${PR_NUM}",
            "new_install_prompt_erase": true,
            "builds": [{"chipFamily": "ESP32-S3", "parts": [
              {"path": "${JOY_BOOTLOADER_FILE}", "offset": 0},
              {"path": "${JOY_PARTITION_FILE}", "offset": 32768},
              {"path": "${JOY_OTA_DATA_FILE}", "offset": 53248},
              {"path": "${JOY_APPLICATION_FILE}", "offset": 65536}
            ]}]
          }
          EOF

          cat > "pr-preview/${TOUGH_MANIFEST_FILE}" << EOF
          {
            "name": "M5Stack Tough Alpha (PR #${PR_NUM} Preview)",
            "version": "pr-${PR_NUM}",
            "new_install_prompt_erase": true,
            "builds": [{"chipFamily": "ESP32", "parts": [
              {"path": "${TOUGH_BOOTLOADER_FILE}", "offset": 4096},
              {"path": "${TOUGH_PARTITION_FILE}", "offset": 32768},
              {"path": "${TOUGH_OTA_DATA_FILE}", "offset": 53248},
              {"path": "${TOUGH_APPLICATION_FILE}", "offset": 65536}
            ]}]
          }
          EOF

          for target in dial frame rlcd joy tough m5dial sticks3 stopwatch stackchan; do
            case "$target" in
              dial) page="$DIAL_FLASH_PAGE"; manifest="$DIAL_MANIFEST_FILE" ;;
              frame) page="$FRAME_FLASH_PAGE"; manifest="$FRAME_MANIFEST_FILE" ;;
              rlcd) page="$RLCD_FLASH_PAGE"; manifest="$RLCD_MANIFEST_FILE" ;;
              joy) page="$JOY_FLASH_PAGE"; manifest="$JOY_MANIFEST_FILE" ;;
              tough) page="$TOUGH_FLASH_PAGE"; manifest="$TOUGH_MANIFEST_FILE" ;;
              *) page="flash-${target}-${PREVIEW_ID}.html"; manifest="manifest-${target}-${PREVIEW_ID}.json" ;;
            esac
            sed \
              -e "s/{{PR_NUMBER}}/${PR_NUM}/g" \
              -e "s/{{TARGET_FILTER}}/${target}/g" \
              -e "s/{{PREVIEW_CREATED_AT}}/${PREVIEW_CREATED_AT}/g" \
              -e "s/{{PREVIEW_HEAD_SHA}}/${PREVIEW_HEAD_SHA}/g" \
              -e "s/{{PREVIEW_HEAD_SHA_SHORT}}/${PREVIEW_HEAD_SHA_SHORT}/g" \
              -e "s/{{PREVIEW_MERGE_SHA_SHORT}}/${PREVIEW_MERGE_SHA_SHORT}/g" \
              -e "s|{{PREVIEW_RUN_URL}}|${PREVIEW_RUN_URL}|g" \
              -e "s/{{PREVIEW_RUN_ID}}/${GITHUB_RUN_ID}/g" \
              -e "s/{{PREVIEW_RUN_ATTEMPT}}/${GITHUB_RUN_ATTEMPT}/g" \
              -e "s|{{PREVIEW_SUBJECT_B64}}|${PREVIEW_SUBJECT_B64}|g" \
              -e "s|manifest-s3.json|${DIAL_MANIFEST_FILE}|g" \
              -e "s|manifest-frame.json|${FRAME_MANIFEST_FILE}|g" \
              -e "s|manifest-rlcd.json|${RLCD_MANIFEST_FILE}|g" \
              -e "s|manifest-joy.json|${JOY_MANIFEST_FILE}|g" \
              -e "s|manifest-tough.json|${TOUGH_MANIFEST_FILE}|g" \
              -e "s|manifest-m5dial.json|manifest-m5dial-${PREVIEW_ID}.json|g" \
              -e "s|manifest-sticks3.json|manifest-sticks3-${PREVIEW_ID}.json|g" \
              -e "s|manifest-stopwatch.json|manifest-stopwatch-${PREVIEW_ID}.json|g" \
              -e "s|manifest-stackchan.json|manifest-stackchan-${PREVIEW_ID}.json|g" \
              -e "s|manifest-knob-aux.json|${AUX_MANIFEST_FILE}|g" \
              web/flash-pr.html > "pr-preview/${page}"
            python3 scripts/check_flash_manifest.py "pr-preview/${manifest}" --assets-dir pr-preview
          done
          python3 scripts/check_flash_manifest.py "pr-preview/${AUX_MANIFEST_FILE}" --assets-dir pr-preview
          ls -la pr-preview/

      - name: Deploy PR preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pr-preview
          destination_dir: pr/${{ github.event.pull_request.number }}
          keep_files: true

      - name: Verify all deployed previews
        id: verify-preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PREVIEW_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          PREVIEW_BASE="https://roon-knob.muness.com/pr/${PR_NUM}"
          mkdir -p deployed-preview
          for attempt in $(seq 1 180); do
            if curl --fail --silent --location \
              "${PREVIEW_BASE}/flash-dial-${PREVIEW_ID}.html" \
              --output "deployed-preview/flash-dial-${PREVIEW_ID}.html"; then
              break
            fi
            if [ "$((attempt % 12))" -eq 0 ]; then
              echo "Waiting for GitHub Pages (${attempt}/180 attempts)..."
              gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
                --jq '{status, commit, created_at, updated_at, error}' || true
            fi
            if [ "${attempt}" -eq 180 ]; then
              echo "Preview did not become available after 15 minutes"
              exit 1
            fi
            sleep 5
          done

          for asset in $(find pr-preview -maxdepth 1 -type f -printf '%f\n'); do
            curl --fail --silent --show-error --location \
              "${PREVIEW_BASE}/${asset}" --output "deployed-preview/${asset}"
            cmp "pr-preview/${asset}" "deployed-preview/${asset}"
          done
          grep -F 'data-target-filter="dial"' "deployed-preview/flash-dial-${PREVIEW_ID}.html"
          grep -F "manifest-knob-aux-${PREVIEW_ID}.json" "deployed-preview/flash-dial-${PREVIEW_ID}.html"
          grep -F 'data-target-filter="frame"' "deployed-preview/flash-frame-${PREVIEW_ID}.html"
          grep -F 'data-target-filter="rlcd"' "deployed-preview/flash-rlcd-${PREVIEW_ID}.html"
          grep -F 'data-target-filter="joy"' "deployed-preview/flash-joy-${PREVIEW_ID}.html"
          grep -F 'data-target-filter="tough"' "deployed-preview/flash-tough-${PREVIEW_ID}.html"
          for target in m5dial sticks3 stopwatch stackchan; do
            grep -F "data-target-filter=\"${target}\"" "deployed-preview/flash-${target}-${PREVIEW_ID}.html"
          done
          for manifest in manifest-s3-${PREVIEW_ID}.json manifest-knob-aux-${PREVIEW_ID}.json manifest-frame-${PREVIEW_ID}.json manifest-rlcd-${PREVIEW_ID}.json manifest-joy-${PREVIEW_ID}.json manifest-tough-${PREVIEW_ID}.json manifest-m5dial-${PREVIEW_ID}.json manifest-sticks3-${PREVIEW_ID}.json manifest-stopwatch-${PREVIEW_ID}.json manifest-stackchan-${PREVIEW_ID}.json; do
            python3 scripts/check_flash_manifest.py "deployed-preview/${manifest}" --assets-dir deployed-preview
          done

          {
            echo "dial_page_url=${PREVIEW_BASE}/flash-dial-${PREVIEW_ID}.html"
            echo "frame_page_url=${PREVIEW_BASE}/flash-frame-${PREVIEW_ID}.html"
            echo "rlcd_page_url=${PREVIEW_BASE}/flash-rlcd-${PREVIEW_ID}.html"
            echo "joy_page_url=${PREVIEW_BASE}/flash-joy-${PREVIEW_ID}.html"
            echo "tough_page_url=${PREVIEW_BASE}/flash-tough-${PREVIEW_ID}.html"
            echo "m5dial_page_url=${PREVIEW_BASE}/flash-m5dial-${PREVIEW_ID}.html"
            echo "sticks3_page_url=${PREVIEW_BASE}/flash-sticks3-${PREVIEW_ID}.html"
            echo "stopwatch_page_url=${PREVIEW_BASE}/flash-stopwatch-${PREVIEW_ID}.html"
            echo "stackchan_page_url=${PREVIEW_BASE}/flash-stackchan-${PREVIEW_ID}.html"
            echo "dial_firmware_sha256=$(sha256sum "deployed-preview/hiphi_dial_merged-${PREVIEW_ID}.bin" | awk '{print $1}')"
            echo "aux_firmware_sha256=$(sha256sum "deployed-preview/hiphi_knob_aux_park_merged-${PREVIEW_ID}.bin" | awk '{print $1}')"
            echo "frame_firmware_sha256=$(sha256sum "deployed-preview/hiphi_frame_merged-${PREVIEW_ID}.bin" | awk '{print $1}')"
            echo "rlcd_firmware_sha256=$(sha256sum "deployed-preview/hiphi_rlcd_merged-${PREVIEW_ID}.bin" | awk '{print $1}')"
            echo "joy_firmware_sha256=$(sha256sum "deployed-preview/hiphi_joy_merged-${PREVIEW_ID}.bin" | awk '{print $1}')"
            echo "tough_firmware_sha256=$(sha256sum "deployed-preview/hiphi_tough_merged-${PREVIEW_ID}.bin" | awk '{print $1}')"
            for target in m5dial sticks3 stopwatch stackchan; do
              echo "${target}_firmware_sha256=$(sha256sum "deployed-preview/hiphi_${target}_merged-${PREVIEW_ID}.bin" | awk '{print $1}')"
            done
          } >> "$GITHUB_OUTPUT"

      - name: Post all preview URLs to PR
        uses: actions/github-script@v8
        env:
          PREVIEW_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DIAL_PAGE_URL: ${{ steps.verify-preview.outputs.dial_page_url }}
          FRAME_PAGE_URL: ${{ steps.verify-preview.outputs.frame_page_url }}
          RLCD_PAGE_URL: ${{ steps.verify-preview.outputs.rlcd_page_url }}
          JOY_PAGE_URL: ${{ steps.verify-preview.outputs.joy_page_url }}
          TOUGH_PAGE_URL: ${{ steps.verify-preview.outputs.tough_page_url }}
          M5DIAL_PAGE_URL: ${{ steps.verify-preview.outputs.m5dial_page_url }}
          STICKS3_PAGE_URL: ${{ steps.verify-preview.outputs.sticks3_page_url }}
          STOPWATCH_PAGE_URL: ${{ steps.verify-preview.outputs.stopwatch_page_url }}
          STACKCHAN_PAGE_URL: ${{ steps.verify-preview.outputs.stackchan_page_url }}
          DIAL_FIRMWARE_SHA256: ${{ steps.verify-preview.outputs.dial_firmware_sha256 }}
          AUX_FIRMWARE_SHA256: ${{ steps.verify-preview.outputs.aux_firmware_sha256 }}
          FRAME_FIRMWARE_SHA256: ${{ steps.verify-preview.outputs.frame_firmware_sha256 }}
          RLCD_FIRMWARE_SHA256: ${{ steps.verify-preview.outputs.rlcd_firmware_sha256 }}
          JOY_FIRMWARE_SHA256: ${{ steps.verify-preview.outputs.joy_firmware_sha256 }}
          TOUGH_FIRMWARE_SHA256: ${{ steps.verify-preview.outputs.tough_firmware_sha256 }}
          M5DIAL_FIRMWARE_SHA256: ${{ steps.verify-preview.outputs.m5dial_firmware_sha256 }}
          STICKS3_FIRMWARE_SHA256: ${{ steps.verify-preview.outputs.sticks3_firmware_sha256 }}
          STOPWATCH_FIRMWARE_SHA256: ${{ steps.verify-preview.outputs.stopwatch_firmware_sha256 }}
          STACKCHAN_FIRMWARE_SHA256: ${{ steps.verify-preview.outputs.stackchan_firmware_sha256 }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_COMMIT_SUBJECT: ${{ steps.preview-commit.outputs.subject }}
          PREVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREVIEW_RUN_ID: ${{ github.run_id }}
          PREVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const headSha = process.env.PREVIEW_HEAD_SHA;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${headSha}`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' &&
              (c.body.includes('<!-- firmware-preview -->') || c.body.includes('Firmware Preview'))
            );
            const body = `<!-- firmware-preview -->
            ### Current firmware previews

            **Run:** [#${process.env.PREVIEW_RUN_ID}](${process.env.PREVIEW_RUN_URL}) (attempt ${process.env.PREVIEW_RUN_ATTEMPT})<br>
            **PR head:** [\`${headSha.slice(0, 12)}\`](${commitUrl})<br>
            **Commit:** ${process.env.PREVIEW_COMMIT_SUBJECT}

            - [Flash HiPhi Dial + one-time auxiliary power step](${process.env.DIAL_PAGE_URL}) — main \`${process.env.DIAL_FIRMWARE_SHA256}\`, auxiliary \`${process.env.AUX_FIRMWARE_SHA256}\`
            - [Flash HiPhi Frame](${process.env.FRAME_PAGE_URL}) — \`${process.env.FRAME_FIRMWARE_SHA256}\`
            - [Flash HiPhi RLCD](${process.env.RLCD_PAGE_URL}) — \`${process.env.RLCD_FIRMWARE_SHA256}\`
            - [Flash AtomS3 JoyStick](${process.env.JOY_PAGE_URL}) — \`${process.env.JOY_FIRMWARE_SHA256}\`
            - [Flash M5Stack Tough](${process.env.TOUGH_PAGE_URL}) — \`${process.env.TOUGH_FIRMWARE_SHA256}\`
            - [Flash M5 Dial Lab Alpha](${process.env.M5DIAL_PAGE_URL}) — \`${process.env.M5DIAL_FIRMWARE_SHA256}\`
            - [Flash M5StickS3 Twist Alpha](${process.env.STICKS3_PAGE_URL}) — \`${process.env.STICKS3_FIRMWARE_SHA256}\`
            - [Flash M5Stack StopWatch Alpha](${process.env.STOPWATCH_PAGE_URL}) — \`${process.env.STOPWATCH_FIRMWARE_SHA256}\`
            - [Flash Kizz Companion Alpha](${process.env.STACKCHAN_PAGE_URL}) — \`${process.env.STACKCHAN_FIRMWARE_SHA256}\`

            Each page, manifest, bootloader, partition table, OTA data image, and application binary was fetched from GitHub Pages and compared byte-for-byte with the job workspace. Manifest checks preserve NVS; browser updates must decline the erase prompt to retain settings. Hardware testing remains the active merge gate.

            _Updated: ${new Date().toISOString()}_`;
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download ESP32-S3 firmware
        uses: actions/download-artifact@v7
        with:
          name: esp32s3-firmware
          path: esp32s3-artifacts

      - name: Download HiPhi Frame firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-frame-firmware
          path: frame-artifacts

      - name: Download HiPhi RLCD firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-rlcd-firmware
          path: rlcd-artifacts

      - name: Download AtomS3 JoyStick firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-joy-firmware
          path: joy-artifacts

      - name: Download M5Stack Tough firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-tough-firmware
          path: tough-artifacts

      - name: Download form-native M5 beta firmware
        uses: actions/download-artifact@v7
        with:
          pattern: hiphi-m5-beta-*
          path: m5-beta-artifacts
          merge-multiple: true

      - name: Download Waveshare auxiliary parking firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-knob-aux-parking-firmware
          path: aux-artifacts

      - name: Prepare gh-pages content
        run: |
          mkdir -p gh-pages-build
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            case "${GITHUB_REF_NAME}" in
              *-alpha.*) CHANNEL_LABEL=" Alpha" ;;
              *-beta.*) CHANNEL_LABEL=" Beta" ;;
              *) CHANNEL_LABEL=" Pre-release" ;;
            esac
            CHANNEL_NOTICE='<div class="warning"><strong>Pre-release firmware</strong><br>Alpha builds are opt-in test builds. They are not delivered by automatic OTA updates; return here to install a newer test build.</div>'
          else
            CHANNEL_LABEL=""
            CHANNEL_NOTICE=""
          fi
          sed "s|{{RELEASE_CHANNEL_LABEL}}|${CHANNEL_LABEL}|g" web/index.html \
            > gh-pages-build/index.html
          sed -e 's/{{TARGET_FILTER}}/all/g' \
            -e "s|{{RELEASE_CHANNEL_NOTICE}}|${CHANNEL_NOTICE}|g" web/flash.html \
            > gh-pages-build/flash.html
          sed -e 's/{{TARGET_FILTER}}/dial/g' \
            -e "s|{{RELEASE_CHANNEL_NOTICE}}|${CHANNEL_NOTICE}|g" web/flash.html \
            > gh-pages-build/flash-dial.html
          sed -e 's/{{TARGET_FILTER}}/frame/g' \
            -e "s|{{RELEASE_CHANNEL_NOTICE}}|${CHANNEL_NOTICE}|g" web/flash.html \
            > gh-pages-build/flash-frame.html
          sed -e 's/{{TARGET_FILTER}}/rlcd/g' \
            -e "s|{{RELEASE_CHANNEL_NOTICE}}|${CHANNEL_NOTICE}|g" web/flash.html \
            > gh-pages-build/flash-rlcd.html
          for target in joy tough m5dial sticks3 stopwatch stackchan knobaux; do
            sed -e "s/{{TARGET_FILTER}}/${target}/g" \
              -e "s|{{RELEASE_CHANNEL_NOTICE}}|${CHANNEL_NOTICE}|g" web/flash.html \
              > "gh-pages-build/flash-${target}.html"
          done
          for manifest in web/manifest-*.json; do
            sed "s/{{VERSION}}/${VERSION}/g" "$manifest" \
              > "gh-pages-build/$(basename "$manifest")"
          done
          cp esp32s3-artifacts/idf_app/build/hiphi_dial.bin gh-pages-build/
          cp esp32s3-artifacts/idf_app/build/bootloader/bootloader.bin \
            gh-pages-build/hiphi_dial_bootloader.bin
          cp esp32s3-artifacts/idf_app/build/partition_table/partition-table.bin \
            gh-pages-build/hiphi_dial_partition-table.bin
          cp esp32s3-artifacts/idf_app/build/ota_data_initial.bin \
            gh-pages-build/hiphi_dial_ota_data_initial.bin
          cp esp32s3-artifacts/idf_app/build/roon_knob.bin gh-pages-build/
          cmp gh-pages-build/hiphi_dial.bin gh-pages-build/roon_knob.bin
          cp esp32s3-artifacts/hiphi_dial_merged.bin gh-pages-build/
          cp esp32s3-artifacts/roon_knob_merged.bin gh-pages-build/
          cmp gh-pages-build/hiphi_dial_merged.bin \
            gh-pages-build/roon_knob_merged.bin
          cp frame-artifacts/hiphi_frame_merged.bin gh-pages-build/
          cp frame-artifacts/frame_app/build/hiphi_frame.bin gh-pages-build/
          cp frame-artifacts/frame_app/build/bootloader/bootloader.bin \
            gh-pages-build/hiphi_frame_bootloader.bin
          cp frame-artifacts/frame_app/build/partition_table/partition-table.bin \
            gh-pages-build/hiphi_frame_partition-table.bin
          cp frame-artifacts/frame_app/build/ota_data_initial.bin \
            gh-pages-build/hiphi_frame_ota_data_initial.bin
          cp rlcd-artifacts/hiphi_rlcd_merged.bin gh-pages-build/
          cp rlcd-artifacts/hiphi_rlcd.bin gh-pages-build/
          cp rlcd-artifacts/rlcd_app/build/bootloader/bootloader.bin \
            gh-pages-build/hiphi_rlcd_bootloader.bin
          cp rlcd-artifacts/rlcd_app/build/partition_table/partition-table.bin \
            gh-pages-build/hiphi_rlcd_partition-table.bin
          cp rlcd-artifacts/rlcd_app/build/ota_data_initial.bin \
            gh-pages-build/hiphi_rlcd_ota_data_initial.bin
          cp joy-artifacts/atom_app/build/hiphi_joy.bin gh-pages-build/
          cp joy-artifacts/atom_app/build/bootloader/bootloader.bin \
            gh-pages-build/hiphi_joy_bootloader.bin
          cp joy-artifacts/atom_app/build/partition_table/partition-table.bin \
            gh-pages-build/hiphi_joy_partition-table.bin
          cp joy-artifacts/atom_app/build/ota_data_initial.bin \
            gh-pages-build/hiphi_joy_ota_data_initial.bin
          cp joy-artifacts/hiphi_joy_merged.bin gh-pages-build/
          cp tough-artifacts/tough_app/build/hiphi_tough.bin gh-pages-build/
          cp tough-artifacts/tough_app/build/bootloader/bootloader.bin \
            gh-pages-build/hiphi_tough_bootloader.bin
          cp tough-artifacts/tough_app/build/partition_table/partition-table.bin \
            gh-pages-build/hiphi_tough_partition-table.bin
          cp tough-artifacts/tough_app/build/ota_data_initial.bin \
            gh-pages-build/hiphi_tough_ota_data_initial.bin
          cp tough-artifacts/hiphi_tough_merged.bin gh-pages-build/

          prepare_m5_pages() {
            local build_target="$1"
            local page_target="$2"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/hiphi_${build_target}.bin" \
              "gh-pages-build/hiphi_${page_target}.bin"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/bootloader/bootloader.bin" \
              "gh-pages-build/hiphi_${page_target}_bootloader.bin"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/partition_table/partition-table.bin" \
              "gh-pages-build/hiphi_${page_target}_partition-table.bin"
            cp "m5-beta-artifacts/m5_beta_app/build-${build_target}/ota_data_initial.bin" \
              "gh-pages-build/hiphi_${page_target}_ota_data_initial.bin"
            cp "m5-beta-artifacts/hiphi_${build_target}_merged.bin" \
              "gh-pages-build/hiphi_${page_target}_merged.bin"
          }
          prepare_m5_pages dial m5dial
          prepare_m5_pages sticks3 sticks3
          prepare_m5_pages stopwatch stopwatch
          prepare_m5_pages stackchan stackchan

          cp aux-artifacts/knob_aux_app/build/hiphi_knob_aux_park.bin gh-pages-build/
          cp aux-artifacts/knob_aux_app/build/bootloader/bootloader.bin \
            gh-pages-build/hiphi_knob_aux_park_bootloader.bin
          cp aux-artifacts/knob_aux_app/build/partition_table/partition-table.bin \
            gh-pages-build/hiphi_knob_aux_park_partition-table.bin
          cp aux-artifacts/hiphi_knob_aux_park_merged.bin gh-pages-build/
          python3 scripts/check_flash_manifest.py \
            gh-pages-build/manifest-s3.json --assets-dir gh-pages-build
          python3 scripts/check_flash_manifest.py \
            gh-pages-build/manifest-frame.json --assets-dir gh-pages-build
          python3 scripts/check_flash_manifest.py \
            gh-pages-build/manifest-rlcd.json --assets-dir gh-pages-build
          for manifest in manifest-joy.json manifest-tough.json manifest-m5dial.json manifest-sticks3.json manifest-stopwatch.json manifest-stackchan.json manifest-knob-aux.json; do
            python3 scripts/check_flash_manifest.py \
              "gh-pages-build/${manifest}" --assets-dir gh-pages-build
          done
          ! grep -R -E '\{\{(VERSION|TARGET_FILTER|RELEASE_CHANNEL_NOTICE)\}\}' gh-pages-build
          echo "roon-knob.muness.com" > gh-pages-build/CNAME
          ls -la gh-pages-build/

      - name: Deploy stable firmware to gh-pages root
        if: ${{ !contains(github.ref_name, '-') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-build
          keep_files: true

      - name: Deploy prerelease firmware to beta channel
        if: ${{ contains(github.ref_name, '-') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-build
          destination_dir: beta

      - name: Verify every deployed firmware link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            DEPLOY_BASE="https://roon-knob.muness.com/beta"
          else
            DEPLOY_BASE="https://roon-knob.muness.com"
          fi
          mkdir -p deployed-release
          for attempt in $(seq 1 180); do
            if curl --fail --silent --location "${DEPLOY_BASE}/manifest-s3.json" \
              --output deployed-release/manifest-s3.json && \
              grep -F "\"version\": \"${GITHUB_REF_NAME#v}\"" deployed-release/manifest-s3.json; then
              break
            fi
            if [ "$((attempt % 12))" -eq 0 ]; then
              echo "Waiting for GitHub Pages (${attempt}/180 attempts)..."
              gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
                --jq '{status, commit, created_at, updated_at, error}' || true
            fi
            if [ "${attempt}" -eq 180 ]; then
              echo "Release pages did not become available after 15 minutes"
              exit 1
            fi
            sleep 5
          done
          while IFS= read -r asset; do
            relative="${asset#gh-pages-build/}"
            curl --fail --silent --show-error --location \
              "${DEPLOY_BASE}/${relative}" --output "deployed-release/${relative}"
            cmp "$asset" "deployed-release/${relative}"
          done < <(find gh-pages-build -maxdepth 1 -type f ! -name CNAME | sort)
          for target in dial frame rlcd joy tough m5dial sticks3 stopwatch stackchan knobaux; do
            test -f "deployed-release/flash-${target}.html"
            grep -F "data-target-filter=\"${target}\"" \
              "deployed-release/flash-${target}.html"
          done
