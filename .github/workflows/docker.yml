            -Icomponents/m5_platform/include \
            tests/test_m5_interaction_policy.c \
            components/m5_platform/m5_interaction_policy.c \
            -lm -o /tmp/test-m5-interaction-policy
          /tmp/test-m5-interaction-policy
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Icomponents/m5_platform/include \
            -Icomponents/m5_platform \
            tests/test_m5_stackchan_choreography.cpp \
            -o /tmp/test-m5-stackchan-choreography
          /tmp/test-m5-stackchan-choreography
