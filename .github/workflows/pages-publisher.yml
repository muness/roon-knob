name: Publish firmware Pages on fleet

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# This must differ from firmware-pages: release/preview jobs hold that lock
# while waiting for this publisher to make their files available.
concurrency:
  group: github-pages-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: [self-hosted, linux, x64, linux-general]
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the prepared site
        shell: bash
        run: |
          set -euo pipefail
          test -f .nojekyll
          test -f index.html
          test "$(cat CNAME)" = firmware.hiphi.audio
          python3 - <<'PY'
          import json
          from pathlib import Path
          for manifest in Path('.').glob('*/manifest-*.json'):
              data = json.loads(manifest.read_text())
              for build in data['builds']:
                  for part in build['parts']:
                      path = (manifest.parent / part['path']).resolve()
                      assert path.is_relative_to(Path.cwd()), f'Unsafe path: {manifest}'
                      assert path.is_file(), f'Missing asset: {path}'
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Publish prepared site
        id: deployment
        uses: actions/deploy-pages@v5
